name: Build GKI Kernel (realme GT7 Pro)

on:
  push:
    paths:
      - '.github/workflows/kernel-build.yml'
      - 'gt7pro_defconfig_full.txt'
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'build = 编译并上传产物, shell = 只开 SSH 调试不编译'
        required: false
        default: 'build'
        type: choice
        options:
          - build
          - shell

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        if: github.event_name == 'workflow_dispatch' || inputs.build_mode == 'build'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          path: kernel
          fetch-depth: 1

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y lz4 libelf-dev bc bison flex cmake

      - name: Download clang r510928 + llvm-binutils
        run: |
          mkdir -p toolchain
          # primary: chromium prebuilt (fast CDN); fallback: googlesource git archive
          if curl -sfL -o /tmp/clang.tbz "https://commondatastorage.googleapis.com/chromium-browser-clang/Linux_x64/clang-r510928.tbz"; then
            tar -xjf /tmp/clang.tbz -C toolchain
          else
            echo "chromium mirror miss, using googlesource archive endpoint"
            curl -sfL "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r510928.tar.gz" | tar -xz -C toolchain
          fi
          test -x toolchain/bin/clang || { echo FATAL no clang; exit 1; }
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/llvm-binutils-stable toolchain/binutils
          toolchain/bin/clang --version | head -1
          ls toolchain/binutils/bin/ld.lld

      - name: Restore extracted defconfig
        run: |
          # config 文件放在仓库根目录 extracted_defconfig.txt（从官方 boot.img IKHEADERS 提取）
          if [ -f kernel/gt7pro_defconfig_full.txt ]; then
            cp kernel/gt7pro_defconfig_full.txt kernel/arch/arm64/configs/gt7pro_defconfig
          else
            echo "::warning::extracted_defconfig.txt not found, fallback to gki_defconfig"
            echo "gki_defconfig" > /tmp/fallback
          fi

      - name: Configure
        working-directory: kernel
        run: |
          CLANG=../toolchain/bin/clang
          BINUTILS=$(pwd)/../toolchain/binutils/bin
          if [ -f arch/arm64/configs/gt7pro_defconfig ]; then
            make ARCH=arm64 O=out gt7pro_defconfig CC=$CLANG LLVM=1 LLVM_BINUTILS=$BINUTILS
          else
            make ARCH=arm64 O=out gki_defconfig CC=$CLANG LLVM=1 LLVM_BINUTILS=$BINUTILS
          fi

      - name: Build Image
        if: (inputs.build_mode == 'build') || (github.event_name == 'push')
        working-directory: kernel
        run: |
          CLANG=../toolchain/bin/clang
          BINUTILS=$(pwd)/../toolchain/binutils/bin
          make ARCH=arm64 O=out -j$(nproc) CC=$CLANG LLVM=1 LLVM_BINUTILS=$BINUTILS Image Image.lz4 2>&1 | tail -100
          ls -la out/arch/arm64/boot/

      - name: Verify version string
        if: (inputs.build_mode == 'build') || (github.event_name == 'push')
        working-directory: kernel
        run: strings out/arch/arm64/boot/Image | grep -m1 "Linux version"

      - name: Upload artifacts
        if: (inputs.build_mode == 'build') || (github.event_name == 'push')
        uses: actions/upload-artifact@v4
        with:
          name: gt7pro-gki-${{ github.sha }}
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/out/arch/arm64/boot/Image.lz4
            kernel/out/.config
          retention-days: 30

      - name: Setup SSH debug (build_mode=shell)
        if: inputs.build_mode == 'shell'
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 30
        with:
          limit-access-to-actor: true